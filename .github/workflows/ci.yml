name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Create database roles
        run: |
          psql -h localhost -U postgres -f scripts/db-roles.sql
          psql -h localhost -U postgres -c "CREATE DATABASE hotel_erp_test OWNER hotel_owner"
      - run: ruff check app tests
      - run: pytest -q
      - name: OpenAPI is up to date
        run: |
          JWT_SECRET=x python -c "import json, app.main as m; print(json.dumps(m.app.openapi(), indent=1))" > /tmp/openapi.json
          diff -q /tmp/openapi.json docs/api/openapi.json
  docker:
    # The image Render deploys. Build-only check, so a broken Dockerfile fails here and not on deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hotel-erp-api:ci .
      - name: Image starts and refuses a deployed env without config
        run: |
          docker run --rm -e APP_ENV=staging hotel-erp-api:ci python -c "import app.main" && exit 1 || echo "refused as expected"
          docker run --rm -e JWT_SECRET=x hotel-erp-api:ci python -c "import app.main; print('imports ok')"
