# Render Blueprint: PRODUCTION (not applied yet). Docs: docs/10-deployment.md (read it before changing this file).
# Apply as a SEPARATE Blueprint (Render > Blueprints > New, Blueprint path: deploy/render.production.yaml).
# Differences from staging: paid always-on plan, migrations as a pre-deploy step, manual deploys from the
# `production` branch, its own Supabase project and secrets.
#
# No secret values in this file (the repo is public). `sync: false` = Render asks for the value when the
# Blueprint is first applied; fill it from deploy/env.production.example.

services:
  - type: web
    name: hotel-erp-api-production
    runtime: docker
    repo: https://github.com/ganesh991212/Hotel-ERP-Backend
    branch: production
    region: singapore          # nearest Render region to India; put Supabase in Singapore too
    plan: starter              # always on; no cold starts
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: false
    preDeployCommand: sh scripts/release.sh   # migrations run once, before traffic moves to the new version
    numInstances: 1            # must stay 1 until realtime moves to Redis (docs/10, "Scaling limit")
    envVars:
      - key: APP_ENV
        value: production
      - key: RUN_RELEASE_ON_START
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: PLATFORM_DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: PUBLIC_DINER_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PLATFORM_ADMIN_EMAIL
        sync: false
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: POWERED_BY_NAME
        value: Vethra
      - key: POWERED_BY_CONTACT
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_WEB_APP_ID
        sync: false
      - key: FIREBASE_ANDROID_APP_ID
        sync: false
      - key: FIREBASE_IOS_APP_ID
        sync: false
      - key: FIREBASE_IOS_BUNDLE_ID
        value: com.hotelerp.hotelErp
      - key: FIREBASE_VAPID_KEY
        sync: false

  - type: web
    name: hotel-erp-web-production
    runtime: static
    repo: https://github.com/ganesh991212/Hotel-ERP-Frontend
    branch: production
    buildCommand: bash scripts/render-build.sh
    staticPublishPath: build/web
    autoDeploy: false
    envVars:
      - key: API_BASE           # https URL of hotel-erp-api-production, no trailing slash
        sync: false
      - key: FLUTTER_VERSION
        value: 3.50.0
    headers:
      # Flutter's main.dart.js is not content-hashed: always revalidate so a deploy reaches every device.
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
